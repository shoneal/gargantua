<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Gargantua</title>
    <meta name="description" content="Lots, lots, lots of screenshots." />
    <meta name="type" content="Article" />
    <meta property="og:url" content="https://shoneal.github.io/gargantua/" />
    <meta property="og:title" content="Gargantua" />
    <meta
      property="og:description"
      content="Lots, lots, lots of screenshots."
    />
    <meta
      property="og:image"
      content="https://shoneal.github.io/gargantua/images/twitter-image.jpg"
    />
    <meta
      property="og:image:secure_url"
      content="https://shoneal.github.io/gargantua/images/twitter-image.jpg"
    />
    <meta property="og:site_name" content="Gargantua" />
    <meta property="og:type" content="article" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gargantua" />
    <meta
      name="twitter:description"
      content="Lots, lots, lots of screenshots."
    />
    <meta
      name="twitter:image"
      content="https://shoneal.github.io/gargantua/images/twitter-image.jpg"
    />
    <link rel="shortcut icon" href="./images/favicons/favicon.ico" />
    <link rel="apple-touch-icon" href="./images/favicons/icon.png" />
    <link
      rel="apple-touch-icon-precomposed"
      sizes="144x144"
      href="./images/favicons/icon-144x144.png"
    />
    <link
      rel="apple-touch-icon-precomposed"
      sizes="114x114"
      href="./images/favicons/icon-114x114.png"
    />
    <link
      rel="apple-touch-icon-precomposed"
      href="./images/favicons/icon-57x57.png"
    />
    <link rel="stylesheet" href="./fonts/fonts.css" />
    <link rel="stylesheet" href="./styles/style.css" />
  </head>

  <body>
    <header>
      <a class="homepage">
        <img src="https://shoneal.github.io/gargantua/images/shaq.png" />
      </a>
    </header>
    <main class="site-content">
      <img
        class="desktop-logo"
        src="https://shoneal.github.io/gargantua/images/logo.png"
      />
      <div class="figure-wrapper">
        <div class="figure"></div>
        <div class="figure" aria-hidden="true"></div>
      </div>
      <div class="search-form">
        <div class="section top">
          <p class="search-form-status"></p>
          <form>
            <div class="input-wrapper">
              <label for="searchTextField">
                <input
                  id="searchTextField"
                  placeholder="Поиск"
                  type="text"
                  value
                />
              </label>
              <button type="submit" value aria-label="Submit Search">
                <svg viewBox="0 0 16 16">
                  <path
                    d="M11.3 9.2c.4-.8.7-1.7.7-2.7C12 3.5 9.5 1 6.5 1S1 3.5 1 6.5 3.5 12 6.5 12c1 0 1.9-.3 2.7-.7l3.3 3.3c.3.3.7.4 1.1.4s.8-.1 1.1-.4c.6-.6.6-1.5 0-2.1l-3.4-3.3zm-4.8 1.1c-2.1 0-3.8-1.7-3.8-3.8 0-2.1 1.7-3.8 3.8-3.8 2.1 0 3.8 1.7 3.8 3.8 0 2.1-1.7 3.8-3.8 3.8z"
                  />
                </svg>
              </button>
            </div>
            <div class="select-wrapper">
              <select class="search-form-sort-by">
                <option value="publish" selected>
                  Сортировка по публикации
                </option>
                <option value="release">Сортировка по дате выхода</option>
                <option value="title">Сортировка по названию</option>
              </select>
              <svg class="checkmark" viewBox="0 0 13 8">
                <path d="M6.5 8 0 1.4 1.4 0l5.1 5.2L11.6 0 13 1.4z" />
              </svg>
            </div>
          </form>
        </div>
        <div class="section bottom">
          <div class="forms">
            <div class="form format-range" aria-label="Format Range">
              <button class="search-multiselect-button" type="button">
                <span>Формат</span>
              </button>
            </div>
            <div class="form year-range" aria-label="Year Range">
              <button class="search-multiselect-button" type="button">
                <span>Год</span>
              </button>
            </div>
            <div class="form rating-range" aria-label="Rating Range">
              <button class="search-multiselect-button" type="button">
                <span>Оценка</span>
              </button>
            </div>
          </div>
        </div>
      </div>
      <div class="movies"></div>
    </main>

    <div class="popup movie-popup">
      <div class="popup-content">
        <div class="header-container">
          <div class="opinion"></div>
          <h1 class="heading"></h1>
          <p class="timestamp"></p>
          <div class="byline-wrapper">
            <div class="byline"></div>
            <time datetime=""></time>
          </div>
          <a class="article-link" href="" target="_blank">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
              <path
                fill="currentColor"
                d="M12.049 0C5.45 0 .104 5.373.104 12S5.45 24 12.049 24c3.928 0 7.414-1.904 9.592-4.844l-9.803-5.174 6.256 6.418h-3.559l-4.373-6.086V20.4h-2.89V3.6h2.89v6.095L14.535 3.6h3.559l-6.422 6.627 9.98-5.368C19.476 1.911 15.984 0 12.05 0zm10.924 7.133-9.994 4.027 10.917-.713a12 12 0 0 0-.923-3.314m-10.065 5.68 10.065 4.054c.458-1.036.774-2.149.923-3.314z"
              />
            </svg>
            Кинопоиск
          </a>
        </div>
        <figure class="imageblock-wrapper">
          <img class="media" src="" alt="" />
          <figcaption></figcaption>
        </figure>
        <section class="article-body"></section>
      </div>
    </div>
    <div class="popup slideshow-popup">
      <button class="close-popup" type="button">
        <svg viewBox="0 0 15 15">
          <g stroke-linecap="square" stroke-miterlimit="10" stroke-width="2">
            <path d="m2 2 11 11M13 2 2 13" />
          </g>
        </svg>
      </button>
      <p><span></span></p>
      <button type="button" class="arrow previous-slide">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 13 24">
          <path
            stroke-miterlimit="10"
            stroke-width="2"
            d="m12 20.983-10-10L12 1"
          />
        </svg>
      </button>
      <button type="button" class="arrow next-slide">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 13 24">
          <path
            stroke-miterlimit="10"
            stroke-width="2"
            d="m1 20.983 10-10L1 1"
          />
        </svg>
      </button>
      <div class="popup-content">
        <div>
          <img src="" />
        </div>
      </div>
    </div>
    <template id="like-template">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path
          d="M9.221 1.795a1 1 0 0 1 1.109-.656l1.04.173a4 4 0 0 1 3.252 4.784L14 9h4.061a3.664 3.664 0 0 1 3.576 2.868A3.68 3.68 0 0 1 21 14.85l.02.087A3.815 3.815 0 0 1 20 18.5v.043l-.01.227a2.82 2.82 0 0 1-.135.663l-.106.282A3.754 3.754 0 0 1 16.295 22h-3.606l-.392-.007a12.002 12.002 0 0 1-5.223-1.388l-.343-.189-.27-.154a2.005 2.005 0 0 0-.863-.26l-.13-.004H3.5a1.5 1.5 0 0 1-1.5-1.5V12.5A1.5 1.5 0 0 1 3.5 11h1.79l.157-.013a1 1 0 0 0 .724-.512l.063-.145 2.987-8.535Zm-1.1 9.196A3 3 0 0 1 5.29 13H4v4.998h1.468a4 4 0 0 1 1.986.528l.27.155.285.157A10 10 0 0 0 12.69 20h3.606c.754 0 1.424-.483 1.663-1.2l.03-.126a.819.819 0 0 0 .012-.131v-.872l.587-.586c.388-.388.577-.927.523-1.465l-.038-.23-.02-.087-.21-.9.55-.744A1.663 1.663 0 0 0 18.061 11H14a2.002 2.002 0 0 1-1.956-2.418l.623-2.904a2 2 0 0 0-1.626-2.392l-.21-.035-2.71 7.741Z"
        />
      </svg>
    </template>
    <template id="dislike-template">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path
          d="m11.31 2 .392.007c1.824.06 3.61.534 5.223 1.388l.343.189.27.154c.264.152.56.24.863.26l.13.004H20.5a1.5 1.5 0 0 1 1.5 1.5V11.5a1.5 1.5 0 0 1-1.5 1.5h-1.79l-.158.013a1 1 0 0 0-.723.512l-.064.145-2.987 8.535a1 1 0 0 1-1.109.656l-1.04-.174a4 4 0 0 1-3.251-4.783L10 15H5.938a3.664 3.664 0 0 1-3.576-2.868A3.682 3.682 0 0 1 3 9.15l-.02-.088A3.816 3.816 0 0 1 4 5.5v-.043l.008-.227a2.86 2.86 0 0 1 .136-.664l.107-.28A3.754 3.754 0 0 1 7.705 2h3.605ZM7.705 4c-.755 0-1.425.483-1.663 1.2l-.032.126a.818.818 0 0 0-.01.131v.872l-.587.586a1.816 1.816 0 0 0-.524 1.465l.038.23.02.087.21.9-.55.744a1.686 1.686 0 0 0-.321 1.18l.029.177c.17.76.844 1.302 1.623 1.302H10a2.002 2.002 0 0 1 1.956 2.419l-.623 2.904-.034.208a2.002 2.002 0 0 0 1.454 2.139l.206.045.21.035 2.708-7.741A3.001 3.001 0 0 1 18.71 11H20V6.002h-1.47c-.696 0-1.38-.183-1.985-.528l-.27-.155-.285-.157A10.002 10.002 0 0 0 11.31 4H7.705Z"
        />
      </svg>
    </template>
    <script src="./scripts/script.js"></script>
  </body>
</html>
