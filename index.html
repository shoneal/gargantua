<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Gargantua</title>
    <meta name="description" content="Lots, lots, lots of screenshots." />
    <meta name="type" content="Article" />
    <meta property="og:url" content="https://shoneal.github.io/gargantua/" />
    <meta property="og:title" content="Gargantua" />
    <meta
      property="og:description"
      content="Lots, lots, lots of screenshots."
    />
    <meta
      property="og:image"
      content="https://shoneal.github.io/gargantua/images/twitter-image.jpg"
    />
    <meta
      property="og:image:secure_url"
      content="https://shoneal.github.io/gargantua/images/twitter-image.jpg"
    />
    <meta property="og:site_name" content="Gargantua" />
    <meta property="og:type" content="article" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gargantua" />
    <meta
      name="twitter:description"
      content="Lots, lots, lots of screenshots."
    />
    <meta
      name="twitter:image"
      content="https://shoneal.github.io/gargantua/images/twitter-image.jpg"
    />
    <link rel="shortcut icon" href="./images/favicons/favicon.ico" />
    <link rel="apple-touch-icon" href="./images/favicons/icon.png" />
    <link
      rel="apple-touch-icon-precomposed"
      sizes="144x144"
      href="./images/favicons/icon-144x144.png"
    />
    <link
      rel="apple-touch-icon-precomposed"
      sizes="114x114"
      href="./images/favicons/icon-114x114.png"
    />
    <link
      rel="apple-touch-icon-precomposed"
      href="./images/favicons/icon-57x57.png"
    />
    <link rel="stylesheet" href="./fonts/fonts.css" />
    <link rel="stylesheet" href="./styles/style.css" />
  </head>

  <body>
    <header>
      <a class="homepage">
        <img src="https://shoneal.github.io/gargantua/images/shaq.png" />
      </a>
    </header>
    <main class="site-content">
      <img
        class="desktop-logo"
        src="https://shoneal.github.io/gargantua/images/logo.png"
      />
      <div class="figure-wrapper">
        <div class="figure"></div>
        <div class="figure" aria-hidden="true"></div>
      </div>
      <div class="search-form">
        <div class="section top">
          <p class="search-form-status"></p>
          <form>
            <div class="input-wrapper">
              <label for="searchTextField">
                <input
                  id="searchTextField"
                  placeholder="Поиск"
                  type="text"
                  value
                />
              </label>
              <button type="submit" value aria-label="Submit Search">
                <svg viewBox="0 0 16 16">
                  <path
                    d="M11.3 9.2c.4-.8.7-1.7.7-2.7C12 3.5 9.5 1 6.5 1S1 3.5 1 6.5 3.5 12 6.5 12c1 0 1.9-.3 2.7-.7l3.3 3.3c.3.3.7.4 1.1.4s.8-.1 1.1-.4c.6-.6.6-1.5 0-2.1l-3.4-3.3zm-4.8 1.1c-2.1 0-3.8-1.7-3.8-3.8 0-2.1 1.7-3.8 3.8-3.8 2.1 0 3.8 1.7 3.8 3.8 0 2.1-1.7 3.8-3.8 3.8z"
                  />
                </svg>
              </button>
            </div>
            <div class="select-wrapper">
              <select class="search-form-sort-by">
                <option value="publish" selected>
                  Сортировка по публикации
                </option>
                <option value="release">Сортировка по дате выхода</option>
                <option value="title">Сортировка по названию</option>
              </select>
              <svg class="checkmark" viewBox="0 0 13 8">
                <path d="M6.5 8 0 1.4 1.4 0l5.1 5.2L11.6 0 13 1.4z" />
              </svg>
            </div>
          </form>
        </div>
        <div class="section bottom">
          <div class="forms">
            <div class="form format-range" aria-label="Format Range">
              <button class="search-multiselect-button" type="button">
                <span>Формат</span>
              </button>
            </div>
            <div class="form year-range" aria-label="Year Range">
              <button class="search-multiselect-button" type="button">
                <span>Год</span>
              </button>
            </div>
            <div class="form rating-range" aria-label="Rating Range">
              <button class="search-multiselect-button" type="button">
                <span>Оценка</span>
              </button>
            </div>
          </div>
        </div>
      </div>
      <div class="movies"></div>
    </main>

    <div class="popup movie-popup">
      <div class="popup-content">
        <div class="header-container">
          <div class="opinion"></div>
          <h1 class="heading"></h1>
          <p class="timestamp"></p>
          <div class="byline-wrapper">
            <div class="byline"></div>
            <time datetime=""></time>
          </div>
          <a class="article-link" href="" target="_blank">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
              <path
                fill="currentColor"
                d="M12.049 0C5.45 0 .104 5.373.104 12S5.45 24 12.049 24c3.928 0 7.414-1.904 9.592-4.844l-9.803-5.174 6.256 6.418h-3.559l-4.373-6.086V20.4h-2.89V3.6h2.89v6.095L14.535 3.6h3.559l-6.422 6.627 9.98-5.368C19.476 1.911 15.984 0 12.05 0zm10.924 7.133-9.994 4.027 10.917-.713a12 12 0 0 0-.923-3.314m-10.065 5.68 10.065 4.054c.458-1.036.774-2.149.923-3.314z"
              />
            </svg>
            Кинопоиск
          </a>
        </div>
        <figure class="imageblock-wrapper">
          <img class="media" src="" alt="" loading="lazy" />
          <figcaption></figcaption>
        </figure>
        <section class="article-body"></section>
      </div>
    </div>
    <div class="popup slideshow-popup">
      <div class="popup-content">
        <button class="close-popup" type="button">
          <svg class="css-1570kgy" viewBox="0 0 15 15">
            <g
              fill="none"
              stroke="#111"
              stroke-linecap="square"
              stroke-miterlimit="10"
              stroke-width="2"
            >
              <path d="m2 2 11 11M13 2 2 13" />
            </g>
          </svg>
        </button>
        <div>
          <img src="" />
        </div>
        <span></span>
        <button type="button" class="arrow previous-slide">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 13 24">
            <path
              stroke="#999"
              stroke-miterlimit="10"
              stroke-width="2"
              d="m12 20.983-10-10L12 1"
            />
          </svg>
        </button>
        <button type="button" class="arrow next-slide">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 13 24">
            <path
              stroke="#999"
              stroke-miterlimit="10"
              stroke-width="2"
              d="m1 20.983 10-10L1 1"
            />
          </svg>
        </button>
      </div>
    </div>
    <template id="like-template">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
        <path
          d="M44.2 1.2c-.6.7-2 4.2-3.2 7.7-3.1 9.2-5.9 14.5-13.4 24.6-3.6 5-7.3 10-8.1 11.3-.9 1.3-3 2.5-4.6 2.9l-2.9.5V79h2.8c1.5 0 7.1 1.6 12.6 3.5 19.1 6.7 43.2 7.3 54.7 1.4 4.3-2.2 5.4-4.6 3.8-8.2-1.1-2.4-.9-2.9 2-5.2 3.6-3.1 3.9-5.2 1.1-8.8l-2-2.6 2.5-2.5c1.4-1.4 2.5-3 2.5-3.6 0-1.9-2.2-5.4-4.3-6.9-1.5-1.1-1.8-2.1-1.3-5.1 1.1-7.2-4-8.8-20.6-6.4-11.3 1.7-11.8 1.7-13.8-.1-2.5-2.3-2.5-5.3 0-13.3 3-9.4 2.7-14.7-.9-18.3-3.2-3.1-5.3-3.6-6.9-1.7z"
        />
      </svg>
    </template>
    <template id="dislike-template">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
        <path
          d="M22.2 14.8c-8.3 3-10.6 5.9-8 10.1 1 1.7.7 2.4-2 4.9-3.8 3.5-3.9 5-1 8.7l2.1 2.7L11 43c-3.6 2.7-3.2 7.7.8 10.8 2.7 2.1 3 2.7 2.1 4.9-1.9 5.1 1.3 8.3 8.4 8.3 1.8 0 7.8-.8 13.4-1.7 9.8-1.7 10.2-1.7 12.2.1 2.6 2.4 2.6 5.4.1 13.4-3 9.4-2.7 14.7.9 18.3 4.9 4.9 6.7 3.9 9.6-5.1 2.6-8.2 7.8-17.9 12.7-24 2.3-3 5.7-7.5 7.3-10 2-3 4.1-4.8 6.3-5.5l3.2-.9V21h-2.5c-1.4 0-7.3-1.7-13.2-3.7-10.5-3.5-11.3-3.7-27.8-4-14.7-.3-17.7-.1-22.3 1.5z"
        />
      </svg>
    </template>
    <script src="./scripts/script.js"></script>
  </body>
</html>
